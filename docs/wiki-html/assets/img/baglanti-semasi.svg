<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="Inter, Helvetica, Arial, sans-serif">
<rect width="1200" height="520" fill="#ffffff"/>
<text x="600" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#13303a">Vehicle → transceiver → NAR board</text>
<!-- OBD -->
<g transform="translate(40,70)">
 <text x="130" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#13303a">OBD-II socket (in the car)</text>
 <path d="M30,20 L230,20 L250,80 L250,150 L230,160 L30,160 L10,150 L10,80 Z" fill="#eef2f5" stroke="#8ba1ac" stroke-width="2"/>
 <rect x="78" y="92" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="85" y="86" font-size="9" text-anchor="middle" fill="#5a6672">1</text><rect x="100" y="92" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="107" y="86" font-size="9" text-anchor="middle" fill="#5a6672">2</text><rect x="122" y="92" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="129" y="86" font-size="9" text-anchor="middle" fill="#5a6672">3</text><rect x="144" y="92" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="151" y="86" font-size="9" text-anchor="middle" fill="#5a6672">4</text><rect x="166" y="92" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="173" y="86" font-size="9" text-anchor="middle" fill="#5a6672">5</text><rect x="188" y="92" width="14" height="14" rx="2" fill="#E8A33D"/><text x="195" y="86" font-size="9" text-anchor="middle" fill="#5a6672">6</text><rect x="210" y="92" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="217" y="86" font-size="9" text-anchor="middle" fill="#5a6672">7</text><rect x="232" y="92" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="239" y="86" font-size="9" text-anchor="middle" fill="#5a6672">8</text><rect x="144" y="92" width="14" height="14" rx="2" fill="#4b5560"/><rect x="166" y="92" width="14" height="14" rx="2" fill="#4b5560"/><rect x="78" y="118" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="85" y="146" font-size="9" text-anchor="middle" fill="#5a6672">9</text><rect x="100" y="118" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="107" y="146" font-size="9" text-anchor="middle" fill="#5a6672">10</text><rect x="122" y="118" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="129" y="146" font-size="9" text-anchor="middle" fill="#5a6672">11</text><rect x="144" y="118" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="151" y="146" font-size="9" text-anchor="middle" fill="#5a6672">12</text><rect x="166" y="118" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="173" y="146" font-size="9" text-anchor="middle" fill="#5a6672">13</text><rect x="188" y="118" width="14" height="14" rx="2" fill="#3EC48A"/><text x="195" y="146" font-size="9" text-anchor="middle" fill="#5a6672">14</text><rect x="210" y="118" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="217" y="146" font-size="9" text-anchor="middle" fill="#5a6672">15</text><rect x="232" y="118" width="14" height="14" rx="2" fill="#cfd6dc"/><text x="239" y="146" font-size="9" text-anchor="middle" fill="#5a6672">16</text>
</g>
<!-- transceiver -->
<g transform="translate(480,70)">
 <text x="120" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#13303a">CAN transceiver (3.3 V)</text>
 <rect x="20" y="20" width="200" height="150" rx="10" fill="#1f2a33"/>
 <rect x="80" y="60" width="80" height="60" rx="4" fill="#0f171d"/>
 <text x="120" y="95" font-size="11" text-anchor="middle" fill="#9fd6e8">SN65HVD230</text>
 <!-- sol pinler: CANH CANL -->
 <circle cx="20" cy="55" r="7" fill="#E8A33D"/><text x="34" y="59" font-size="11" fill="#fff">CANH</text>
 <circle cx="20" cy="85" r="7" fill="#3EC48A"/><text x="34" y="89" font-size="11" fill="#fff">CANL</text>
 <circle cx="20" cy="135" r="7" fill="#4b5560" stroke="#fff"/><text x="34" y="139" font-size="11" fill="#fff">GND</text>
 <!-- sağ pinler: 3V3 GND TXD RXD -->
 <circle cx="220" cy="45" r="7" fill="#E25555"/><text x="206" y="49" font-size="11" fill="#fff" text-anchor="end">3V3</text>
 <circle cx="220" cy="75" r="7" fill="#4b5560" stroke="#fff"/><text x="206" y="79" font-size="11" fill="#fff" text-anchor="end">GND</text>
 <circle cx="220" cy="105" r="7" fill="#4A7BD9"/><text x="206" y="109" font-size="11" fill="#fff" text-anchor="end">TXD</text>
 <circle cx="220" cy="135" r="7" fill="#9B5DE5"/><text x="206" y="139" font-size="11" fill="#fff" text-anchor="end">RXD</text>
 <text x="120" y="195" font-size="12" text-anchor="middle" fill="#5a6672">A 3.3 V part such as SN65HVD230 or TJA1051T/3. 120 Ω ter</text>
 <text x="120" y="212" font-size="12" text-anchor="middle" fill="#5a6672">mination off.</text>
</g>
<!-- NAR kartı -->
<g transform="translate(900,70)">
 <text x="130" y="0" font-size="15" font-weight="700" text-anchor="middle" fill="#13303a">NAR board (ESP32-S3)</text>
 <rect x="20" y="20" width="220" height="150" rx="8" fill="#2f7d5a"/>
 <rect x="95" y="55" width="70" height="70" rx="3" fill="#1a1f24"/><text x="130" y="95" font-size="10" text-anchor="middle" fill="#9fd6e8">ESP32-S3</text>
 <circle cx="20" cy="45" r="7" fill="#E25555"/><text x="34" y="49" font-size="11" fill="#fff">3.3 V</text>
 <circle cx="20" cy="75" r="7" fill="#4b5560" stroke="#fff"/><text x="34" y="79" font-size="11" fill="#fff">GND</text>
 <circle cx="20" cy="105" r="7" fill="#4A7BD9"/><text x="34" y="109" font-size="11" fill="#fff">GPIO4</text>
 <circle cx="20" cy="135" r="7" fill="#9B5DE5"/><text x="34" y="139" font-size="11" fill="#fff">GPIO6</text>
 <text x="130" y="195" font-size="12" text-anchor="middle" fill="#5a6672">GPIO4 = TX, GPIO6 = RX. The board starts in listen-only mode.</text>
</g>
<!-- teller: OBD → trx -->
<g fill="none" stroke-width="4" stroke-linecap="round">
 <path d="M228,169 C330,169 380,125 500,125" stroke="#E8A33D"/>
 <path d="M228,195 C330,195 380,155 500,155" stroke="#3EC48A"/>
 <path d="M191,178 C191,250 260,250 380,250 C450,250 470,205 500,205" stroke="#4b5560"/>
 <!-- trx → kart -->
 <path d="M700,115 L920,115" stroke="#E25555"/>
 <path d="M700,145 L920,145" stroke="#4b5560"/>
 <path d="M700,175 L920,175" stroke="#4A7BD9"/>
 <path d="M700,205 L920,205" stroke="#9B5DE5"/>
</g>
<g font-size="12" font-weight="700">
 <text x="330" y="118" fill="#b7791f">pin 6 · CANH</text>
 <text x="330" y="190" fill="#2a8a60">pin 14 · CANL</text>
 <text x="300" y="272" fill="#4b5560">pin 4/5 · GND</text>
 <text x="810" y="108" fill="#E25555" text-anchor="middle">3.3 V</text>
 <text x="810" y="138" fill="#4b5560" text-anchor="middle">GND</text>
 <text x="810" y="168" fill="#4A7BD9" text-anchor="middle">TXD → GPIO4</text>
 <text x="810" y="198" fill="#9B5DE5" text-anchor="middle">RXD → GPIO6</text>
</g>
<rect x="40" y="330" width="1120" height="150" rx="14" fill="#fff6e8" stroke="#E8A33D" stroke-width="2"/>
<text x="70" y="365" font-size="15" font-weight="700" fill="#8a5a12">!</text>
<text x="95" y="365" font-size="15" font-weight="700" fill="#8a5a12">CANH/CANL swapped → no frames at all; GND missing → unstable bus.</text>
<g font-size="13" fill="#3c4a55">
 <text x="95" y="392" font-size="13">• Under the dashboard, driver side. Pin numbers are printed on the socket.</text>
 <text x="95" y="415">• OBD-II: pin 6 CANH, pin 14 CANL, pin 4 chassis GND, pin 5 signal GND, pin 16 +12 V (NOT connected to the board).</text>
 <text x="95" y="438">• The transceiver must be a 3.3 V part; 5 V parts (TJA1050, MCP2551) are not suitable for ESP32 pins.</text>
 <text x="95" y="461">• Passenger cars mostly run at 500 kbit/s; if unsure, use “Find bitrate” in the app.</text>
</g>
</svg>